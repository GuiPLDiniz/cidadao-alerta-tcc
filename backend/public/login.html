<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidadão Alerta - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5a6fd8;
        }

        .switch-form {
            text-align: center;
            margin-top: 20px;
        }

        .switch-form a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
        }

        .message {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🏙️ Cidadão Alerta</h1>
        <p class="subtitle">Faça login para reportar problemas urbanos</p>
        
        <div id="message" class="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Senha:</label>
                <input type="password" id="password" placeholder="Sua senha" required>
            </div>
            
            <button type="submit">Entrar</button>
        </form>

        <form id="registerForm" style="display: none;">
            <div class="form-group">
                <label for="regName">Nome:</label>
                <input type="text" id="regName" placeholder="Seu nome completo" required>
            </div>
            
            <div class="form-group">
                <label for="regEmail">E-mail:</label>
                <input type="email" id="regEmail" placeholder="seu@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="regPassword">Senha:</label>
                <input type="password" id="regPassword" placeholder="Crie uma senha" required>
            </div>
            
            <button type="submit">Cadastrar</button>
        </form>

        <div class="switch-form">
            <a id="switchLink" onclick="toggleForms()">Não tem conta? Cadastre-se</a>
        </div>
    </div>

    <script>
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
        }

        function toggleForms() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const switchLink = document.getElementById('switchLink');
            
            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                switchLink.textContent = 'Não tem conta? Cadastre-se';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                switchLink.textContent = 'Já tem conta? Faça login';
            }
            
            document.getElementById('message').style.display = 'none';
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:3000/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                
                /*if (data.success) {
                    showMessage(`✅ ${data.message} Bem-vindo, ${data.user.name}!`, 'success');
                    // Aqui salvaríamos o token para usar nas próximas requisições
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                }*/
               if (data.success) {
                    showMessage(`✅ ${data.message} Redirecionando...`, 'success');
                    
                    // Salvar token e dados do usuário
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Redirecionar para o mapa após 2 segundos
                    setTimeout(() => {
                        window.location.href = '/mapa.html';
                    }, 2000);
                } else {
                    showMessage(`❌ ${data.message}`, 'error');
                }
            } catch (error) {
                showMessage('❌ Erro de conexão com o servidor', 'error');
            }
        });

        // Cadastro
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            try {
                const response = await fetch('http://localhost:3000/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();
                
                console.log('Resposta do cadastro:', data); // Para debug

                if (data.success) {
                showMessage(`✅ ${data.message} Redirecionando...`, 'success');
                
                // Salvar token e dados do usuário
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                // Redirecionar para o mapa após 2 segundos
                setTimeout(() => {
                    window.location.href = '/mapa.html';
                }, 2000);
                }
                
                /*if (data.success) {
                showMessage(`✅ ${data.message}`, 'success');
                // Limpa o formulário
                document.getElementById('registerForm').reset();
                // Volta para o login após 2 segundos
                setTimeout(() => {
                    toggleForms();
                }, 2000);
                }*/ else {
                showMessage(`❌ ${data.message}`, 'error');
                }
            } catch (error) {
                console.error('Erro no cadastro:', error);
                showMessage('❌ Erro de conexão com o servidor', 'error');
            }
            });
    </script>
</body>
</html>
