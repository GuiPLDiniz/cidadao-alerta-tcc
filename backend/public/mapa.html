<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidadão Alerta - Mapa</title>
    
    <!-- Mapbox CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        .header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-name {
            font-weight: 500;
            color: #2c3e50;
        }

        .btn-logout {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-logout:hover {
            background: #c0392b;
        }

        .btn-add-problem {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            background: #27ae60;
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-add-problem:hover {
            background: #219a52;
            transform: scale(1.05);
        }

        /* Modal de cadastro de problema */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #2c3e50;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3498db;
        }

        .btn-submit {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }

        .btn-submit:hover {
            background: #2980b9;
        }

        .btn-close {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        .btn-close:hover {
            background: #7f8c8d;
        }

        /* Marcadores personalizados */
        .mapboxgl-marker {
            cursor: pointer;
        }

        .problem-marker {
            background: #e74c3c;
            border: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .problem-marker.high-score {
            background: #27ae60;
        }

        .problem-marker.medium-score {
            background: #f39c12;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">🏙️ Cidadão Alerta</div>
        <div class="user-info">
            <span class="user-name" id="userName">Usuário</span>
            <button class="btn-logout" onclick="logout()">Sair</button>
        </div>
    </div>

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Botão Adicionar Problema -->
    <button class="btn-add-problem" onclick="openProblemModal()">+</button>

    <!-- Modal de Cadastro de Problema -->
    <div id="problemModal" class="modal">
        <div class="modal-content">
            <h2>📝 Reportar Problema</h2>
            <form id="problemForm">
                <div class="form-group">
                    <label for="titulo">Título do Problema:</label>
                    <input type="text" id="titulo" name="titulo" placeholder="Ex: Buraco na rua, Lixo acumulado..." required>
                </div>
                
                <div class="form-group">
                    <label for="descricao">Descrição:</label>
                    <textarea id="descricao" name="descricao" rows="3" placeholder="Descreva o problema em detalhes..."></textarea>
                </div>
                
                <div class="form-group">
                    <label for="foto">Foto (opcional):</label>
                    <input type="file" id="foto" name="foto" accept="image/*">
                </div>
                
                <input type="hidden" id="latitude" name="latitude">
                <input type="hidden" id="longitude" name="longitude">
                
                <button type="submit" class="btn-submit">📤 Enviar Denúncia</button>
                <button type="button" class="btn-close" onclick="closeProblemModal()">Cancelar</button>
            </form>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="loading" style="display: none;">
        Carregando...
    </div>

    <!-- Mapbox JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    
    <script>
        // Configuração do Mapbox
        mapboxgl.accessToken = 'pk.eyJ1IjoiZ3VpcGxkIiwiYSI6ImNtaTZnbGZ4MjAwMzMyaXB2aWZyOTBiYngifQ.I4V_bUVLj3aX4klKSBQvUA';
        
        let map;
        let userLocation = null;
        let markers = [];
        let currentUser = null;

        // Inicializar mapa quando a página carregar
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            initMap();
            loadUserInfo();
        });

        // Verificar se usuário está logado
        function checkAuth() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            if (!token || !user) {
                window.location.href = '/login.html';
                return;
            }
            
            currentUser = JSON.parse(user);
        }

        // Carregar informações do usuário
        function loadUserInfo() {
            if (currentUser) {
                document.getElementById('userName').textContent = currentUser.name;
            }
        }

        // Inicializar mapa
        function initMap() {
            map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/mapbox/streets-v12',
                center: [-46.6333, -23.5505], // São Paulo
                zoom: 12
            });

            // Adicionar controles de navegação
            map.addControl(new mapboxgl.NavigationControl());

            // Obter localização do usuário
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    position => {
                        userLocation = [position.coords.longitude, position.coords.latitude];
                        map.setCenter(userLocation);
                        map.setZoom(14);
                        
                        // Carregar problemas próximos
                        loadProblemas(userLocation[1], userLocation[0]);
                    },
                    error => {
                        console.error('Erro ao obter localização:', error);
                        loadProblemas(-23.5505, -46.6333); // Fallback para SP
                    }
                );
            }

            // Quando clicar no mapa, definir coordenadas para o formulário
            map.on('click', function(e) {
                document.getElementById('latitude').value = e.lngLat.lat;
                document.getElementById('longitude').value = e.lngLat.lng;
                openProblemModal();
            });
        }

        // Carregar problemas da API
        async function loadProblemas(lat, lng) {
            showLoading(true);
            
            try {
                const response = await fetch(`/problemas?lat=${lat}&lng=${lng}`);
                const data = await response.json();
                
                if (data.success) {
                    addMarkersToMap(data.problemas);
                }
            } catch (error) {
                console.error('Erro ao carregar problemas:', error);
            } finally {
                showLoading(false);
            }
        }

        // Adicionar marcadores no mapa
        function addMarkersToMap(problemas) {
            // Remover marcadores antigos
            markers.forEach(marker => marker.remove());
            markers = [];

            problemas.forEach(problema => {
                // Criar elemento HTML personalizado para o marcador
                const el = document.createElement('div');
                el.className = 'problem-marker';
                
                // Cor baseada no score
                const score = problema.upvotes - problema.downvotes;
                if (score > 5) el.classList.add('high-score');
                else if (score > 0) el.classList.add('medium-score');

                // Criar marcador
                const marker = new mapboxgl.Marker(el)
                    .setLngLat([problema.longitude, problema.latitude])
                    .setPopup(new mapboxgl.Popup({ offset: 25 })
                        .setHTML(`
                            <div style="padding: 10px; max-width: 250px;">
                                <h3 style="margin: 0 0 10px 0; color: #2c3e50;">${problema.titulo}</h3>
                                <p style="margin: 0 0 10px 0; color: #7f8c8d;">${problema.descricao || 'Sem descrição'}</p>
                                ${problema.foto_url ? `<img src="${problema.foto_url}" style="width: 100%; border-radius: 5px; margin-bottom: 10px;">` : ''}
                                <div style="font-size: 12px; color: #95a5a6;">
                                    Por: ${problema.usuario_nome}<br>
                                    👍 ${problema.upvotes} | 👎 ${problema.downvotes}
                                </div>
                            </div>
                        `))
                    .addTo(map);

                markers.push(marker);
            });
        }

        // Modal functions
        function openProblemModal() {
            // Se não tem coordenadas definidas, usar localização atual
            if (!document.getElementById('latitude').value && userLocation) {
                document.getElementById('latitude').value = userLocation[1];
                document.getElementById('longitude').value = userLocation[0];
            }
            
            document.getElementById('problemModal').style.display = 'flex';
        }

        function closeProblemModal() {
            document.getElementById('problemModal').style.display = 'none';
            document.getElementById('problemForm').reset();
        }

        // Enviar formulário de problema
        document.getElementById('problemForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const token = localStorage.getItem('token');

            showLoading(true);

            try {
                const response = await fetch('/problemas', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    alert('✅ Problema reportado com sucesso!');
                    closeProblemModal();
                    
                    // Recarregar problemas
                    if (userLocation) {
                        loadProblemas(userLocation[1], userLocation[0]);
                    }
                } else {
                    alert('❌ Erro ao reportar problema: ' + data.message);
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('❌ Erro de conexão');
            } finally {
                showLoading(false);
            }
        });

        // Logout
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        }

        // Loading
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // Fechar modal clicando fora
        window.onclick = function(event) {
            const modal = document.getElementById('problemModal');
            if (event.target === modal) {
                closeProblemModal();
            }
        }
    </script>
</body>
</html>
